<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | SmartGym</title>
  <link rel="stylesheet" href="../admin.css" />
  
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-brand">
        <div class="auth-logo">SG</div>
        <div>
          <h1>SmartGym Admin</h1>
          <p>Connexion sécurisée pour l'administration du site.</p>
        </div>
      </div>
      <form id="loginForm" class="auth-form">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="admin@gmail.com" required />

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="123456" required />

        <button type="submit">Login</button>
        <p class="auth-error" id="loginError"></p>
      </form>
    </section>
  </main>
  <script src="../admin.js"></script>
</body>
</html>
